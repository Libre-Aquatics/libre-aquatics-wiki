name: Content correction
description: Report an error or outdated fact on a wiki page
title: "[Correction]: "
labels: [content]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or path of the affected page
      placeholder: https://wiki.libreaquatics.org/equipment/swimming/timers/system-6/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote or describe the statement that is incorrect or outdated.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What it should say
      description: The corrected fact, as best you know it.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A manual, datasheet, rulebook, or other independent source that supports the correction. Corrections without a source may take longer to verify.
    validations:
      required: false
