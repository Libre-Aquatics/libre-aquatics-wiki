name: Article request
description: Suggest a piece of equipment, vendor, or topic the wiki should cover
title: "[Request]: "
labels: [content]
body:
  - type: input
    id: subject
    attributes:
      label: Subject
      description: The product, vendor, or topic the article should cover.
      placeholder: Colorado Time Systems System 6
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Equipment
        - Vendor
        - Timing or scoring
        - Officiating or rules
        - Meet or team management
        - Software
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should the article cover, and why is it useful? Links to manuals, datasheets, or other sources are very welcome; articles here are written from primary sources.
    validations:
      required: false
